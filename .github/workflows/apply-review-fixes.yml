name: Apply review fixes

on:
  push:
    branches:
      - feat/rust-market-maker
    paths:
      - scripts/apply_review_fixes.py
      - .github/workflows/apply-review-fixes.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/rust-market-maker
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.82.0
        with:
          components: rustfmt, clippy
      - name: Make README migration tolerant
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("scripts/apply_review_fixes.py")
          content = path.read_text(encoding="utf-8")
          needle = '    content = read(path)\n    count = content.count(old)\n'
          replacement = (
              '    content = read(path)\n'
              '    if path == "README.md" and old.startswith("# Cancel bot-prefixed") and old not in content:\n'
              '        old = "startup_cancel_existing_bot_orders = true\\n"\n'
              '    count = content.count(old)\n'
          )
          if content.count(needle) != 1:
              raise SystemExit("unexpected review-script helper layout")
          path.write_text(content.replace(needle, replacement, 1), encoding="utf-8")
          PY
      - name: Apply reviewed changes
        run: python3 scripts/apply_review_fixes.py
      - name: Generate dependency lockfile
        run: cargo generate-lockfile
      - name: Format
        run: cargo fmt --all -- --check
      - name: Check
        run: cargo check --locked --all-targets
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked --all-targets
      - name: Commit reviewed changes
        run: |
          rm -f scripts/apply_review_fixes.py .github/workflows/apply-review-fixes.yml
          rmdir scripts 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: harden order state and shutdown safety"
          git push origin HEAD:feat/rust-market-maker
