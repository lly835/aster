name: Apply review fixes

on:
  push:
    branches:
      - feat/rust-market-maker
    paths:
      - scripts/final_review_patch.py
      - .github/workflows/apply-review-fixes.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/rust-market-maker
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply final reviewed changes
        run: python3 scripts/final_review_patch.py
      - name: Refresh dependency lockfile
        run: cargo generate-lockfile
      - name: Format
        run: cargo fmt --all
      - name: Check
        run: cargo check --locked --all-targets
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked --all-targets
      - name: Commit final reviewed source changes
        run: |
          git restore --source=HEAD -- \
            .github/workflows/ci.yml \
            .github/workflows/apply-review-fixes.yml \
            scripts/apply_review_fixes.py \
            scripts/final_review_patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to commit"
            exit 0
          fi
          git commit -m "fix: close remaining order-state races"
          git push origin HEAD:feat/rust-market-maker
