name: Apply review fixes

on:
  push:
    branches:
      - feat/rust-market-maker
    paths:
      - scripts/apply_review_fixes.py
      - .github/workflows/apply-review-fixes.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/rust-market-maker
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.82.0
        with:
          components: rustfmt, clippy
      - name: Apply reviewed changes
        run: python3 scripts/apply_review_fixes.py
      - name: Generate dependency lockfile
        run: cargo generate-lockfile
      - name: Format
        run: cargo fmt --all -- --check
      - name: Check
        run: cargo check --locked --all-targets
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked --all-targets
      - name: Commit reviewed changes
        run: |
          rm -f scripts/apply_review_fixes.py .github/workflows/apply-review-fixes.yml
          rmdir scripts 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: harden order state and shutdown safety"
          git push origin HEAD:feat/rust-market-maker
