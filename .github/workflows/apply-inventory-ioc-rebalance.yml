name: Apply inventory IOC rebalancing

on:
  push:
    branches:
      - feat/inventory-ioc-rebalance
    paths:
      - scripts/apply_inventory_ioc_rebalance.py
      - .github/workflows/apply-inventory-ioc-rebalance.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/inventory-ioc-rebalance
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply maker-first IOC changes
        run: python3 scripts/apply_inventory_ioc_rebalance.py
      - name: Format
        run: cargo fmt --all
      - name: Check
        run: cargo check --locked --all-targets
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked --all-targets
      - name: Commit validated source changes
        run: |
          git restore --source=HEAD -- \
            .github/workflows/apply-inventory-ioc-rebalance.yml \
            scripts/apply_inventory_ioc_rebalance.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add maker-first IOC inventory rebalancing"
          git push origin HEAD:feat/inventory-ioc-rebalance
